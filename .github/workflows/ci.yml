name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Build native library
        run: make

      - name: Dart pub get
        run: dart pub get

      - name: Dart analyze
        run: dart analyze

      - name: Dart test
        run: dart test

      # nozzle-dev#197: `-shared` links with undefined symbols allowed, so a core source
      # missing from the Makefile's hand-written list leaves a green build that fails
      # at runtime. Force the F16C path whatever the image's default is, then prove
      # no core symbol is left unresolved and the F16C object is actually linked.
      - name: Verify core symbols resolve with F16C enabled
        if: runner.os == 'Linux'
        run: |
          make BUILD_DIR=.build-f16c CXX="c++ -mf16c"
          undefined=$(nm -DC --undefined-only .build-f16c/libnozzle.so)
          if grep -F nozzle <<<"$undefined"; then
            echo "unresolved core symbols in .build-f16c/libnozzle.so" >&2
            exit 1
          fi
          nm -C .build-f16c/libnozzle.so | grep -F ' T nozzle::detail::widen_half_to_float_f16c'
